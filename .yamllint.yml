---
extends: default

ignore: |
  website/node_modules/
  website/dist/
  website/.astro/
  website/test-results/
  website/playwright-report/
  .tmp/

rules:
  line-length:
    max: 120
    level: warning
  trailing-spaces: enable
  document-start: disable
  truthy:
    allowed-values: ['true', 'false', 'on', 'off', 'yes', 'no']
  brackets:
    max-spaces-inside: 1
  indentation:
    spaces: 2
    indent-sequences: true
