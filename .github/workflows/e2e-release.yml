name: E2E Release Gate

# Reusable workflow — called from release.yml after artifacts are attached to
# the draft release. A write-scoped staging job downloads the assets; the
# read-scoped matrix tests their per-platform artifact copies. Promotion remains
# the caller's publish job.
on:
  workflow_call:
    inputs:
      release_tag:
        description: "The release tag to test (e.g. v1.2.3)"
        required: true
        type: string
      test_org_1:
        description: "First test organization name"
        required: false
        type: string
        default: "gh-app-auth-test-1"
      test_org_2:
        description: "Second test organization name"
        required: false
        type: string
        default: "gh-app-auth-test-2"
    secrets:
      E2E_APP_ID:
        required: true
      E2E_PRIVATE_KEY_B64:
        required: true
# Draft assets are downloaded once by the staging job with contents: write.
# The secret-bearing test matrix receives read-only repository permissions.
permissions:
  contents: read

env:
  TEST_TIMEOUT: "10m"
  # The release artifacts are static (CGO_ENABLED=0 in the Makefile); the test
  # driver is pure Go too. Disabling cgo keeps `go test` working in minimal
  # containers (ubuntu:latest ships gcc without libc headers).
  CGO_ENABLED: "0"

jobs:
  download-assets:
    name: Stage release assets
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download assets from the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --dir release-assets

      - name: Upload Linux ARM64 binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-linux-arm64-binary
          path: release-assets/linux-arm64
          if-no-files-found: error
          retention-days: 1

      - name: Upload Linux ARM64 RPM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-linux-arm64-rpm
          path: release-assets/gh-app-auth_*_aarch64.rpm
          if-no-files-found: error
          retention-days: 1

      - name: Upload Linux ARM64 DEB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-linux-arm64-deb
          path: release-assets/gh-app-auth_*_arm64.deb
          if-no-files-found: error
          retention-days: 1

      - name: Upload Linux AMD64 binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-linux-amd64-binary
          path: release-assets/linux-amd64
          if-no-files-found: error
          retention-days: 1

      - name: Upload Linux AMD64 RPM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-linux-amd64-rpm
          path: release-assets/gh-app-auth_*_x86_64.rpm
          if-no-files-found: error
          retention-days: 1

      - name: Upload Linux AMD64 DEB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-linux-amd64-deb
          path: release-assets/gh-app-auth_*_amd64.deb
          if-no-files-found: error
          retention-days: 1

      - name: Upload macOS ARM64 binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-darwin-arm64-binary
          path: release-assets/darwin-arm64
          if-no-files-found: error
          retention-days: 1

      - name: Upload macOS AMD64 binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-darwin-amd64-binary
          path: release-assets/darwin-amd64
          if-no-files-found: error
          retention-days: 1

      - name: Upload Windows ARM64 binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-windows-arm64-binary
          path: release-assets/windows-arm64.exe
          if-no-files-found: error
          retention-days: 1

      - name: Upload Windows AMD64 binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-windows-amd64-binary
          path: release-assets/windows-amd64.exe
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────
  # Linux ARM64: test the linux-arm64 binary directly
  # ─────────────────────────────────────────────
  e2e-linux-arm64:
    name: E2E / Linux ARM64 Binary
    needs: download-assets
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download staged Linux ARM64 binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: release-linux-arm64-binary
          path: ./e2e-artifact

      - name: Prepare Linux ARM64 binary
        run: |
          mv ./e2e-artifact/linux-arm64 ./e2e-artifact/gh-app-auth
          chmod +x ./e2e-artifact/gh-app-auth

      - name: Verify binary is standalone (no gh CLI required)
        run: |
          ./e2e-artifact/gh-app-auth --version
          ./e2e-artifact/gh-app-auth --help

      - name: Run E2E tests
        env:
          E2E_BINARY_PATH: ${{ github.workspace }}/e2e-artifact/gh-app-auth
          E2E_APP_ID: ${{ secrets.E2E_APP_ID }}
          E2E_PRIVATE_KEY_B64: ${{ secrets.E2E_PRIVATE_KEY_B64 }}
          E2E_TEST_ORG_1: ${{ inputs.test_org_1 }}
          E2E_TEST_ORG_2: ${{ inputs.test_org_2 }}
        run: |
          go test -v -tags=e2e -timeout=${{ env.TEST_TIMEOUT }} ./test/e2e/...

  # ─────────────────────────────────────────────
  # Linux RPM ARM64: test inside a Fedora container on ARM64
  # ─────────────────────────────────────────────
  e2e-linux-rpm-arm64:
    name: E2E / Fedora ARM64 RPM
    needs: download-assets
    runs-on: ubuntu-24.04-arm
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install prerequisites
        run: dnf install -y git golang gh jq which

      - name: Download staged ARM64 RPM
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: release-linux-arm64-rpm
          path: ./e2e-artifact

      - name: Install RPM package
        run: rpm -i ./e2e-artifact/*.rpm

      - name: Verify standalone binary path and version
        run: |
          which gh-app-auth
          gh-app-auth --version
          gh-app-auth --help

      - name: Run E2E tests (against installed binary)
        env:
          E2E_BINARY_PATH: /usr/bin/gh-app-auth
          E2E_APP_ID: ${{ secrets.E2E_APP_ID }}
          E2E_PRIVATE_KEY_B64: ${{ secrets.E2E_PRIVATE_KEY_B64 }}
          E2E_TEST_ORG_1: ${{ inputs.test_org_1 }}
          E2E_TEST_ORG_2: ${{ inputs.test_org_2 }}
        run: |
          go test -v -tags=e2e -timeout=${{ env.TEST_TIMEOUT }} ./test/e2e/...

  # ─────────────────────────────────────────────
  # Linux DEB ARM64: test inside an Ubuntu container on ARM64
  # ─────────────────────────────────────────────
  e2e-linux-deb-arm64:
    name: E2E / Ubuntu ARM64 DEB
    needs: download-assets
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y git golang-go gh jq curl

      - name: Download staged ARM64 DEB
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: release-linux-arm64-deb
          path: ./e2e-artifact

      - name: Install DEB package
        run: |
          dpkg -i ./e2e-artifact/*.deb || apt-get install -f -y

      - name: Verify standalone binary path and version
        run: |
          which gh-app-auth
          gh-app-auth --version
          gh-app-auth --help

      - name: Run E2E tests (against installed binary)
        env:
          E2E_BINARY_PATH: /usr/bin/gh-app-auth
