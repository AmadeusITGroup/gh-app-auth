          E2E_PRIVATE_KEY_B64: ${{ secrets.E2E_PRIVATE_KEY_B64 }}
          E2E_TEST_ORG_1: ${{ inputs.test_org_1 }}
          E2E_TEST_ORG_2: ${{ inputs.test_org_2 }}
        run: |
          go test -v -tags=e2e -timeout=${{ env.TEST_TIMEOUT }} ./test/e2e/...

  # ─────────────────────────────────────────────
  # Linux: test the linux-amd64 binary directly
  # ─────────────────────────────────────────────
  e2e-linux:
    name: E2E / Linux AMD64 Binary
    needs: download-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download staged Linux AMD64 binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: release-linux-amd64-binary
          path: ./e2e-artifact

      - name: Prepare Linux AMD64 binary
        run: |
          mv ./e2e-artifact/linux-amd64 ./e2e-artifact/gh-app-auth
          chmod +x ./e2e-artifact/gh-app-auth

      - name: Verify binary is standalone (no gh CLI required)
        run: |
          ./e2e-artifact/gh-app-auth --version
          ./e2e-artifact/gh-app-auth --help

      - name: Run E2E tests
        env:
          E2E_BINARY_PATH: ${{ github.workspace }}/e2e-artifact/gh-app-auth
          E2E_APP_ID: ${{ secrets.E2E_APP_ID }}
          E2E_PRIVATE_KEY_B64: ${{ secrets.E2E_PRIVATE_KEY_B64 }}
          E2E_TEST_ORG_1: ${{ inputs.test_org_1 }}
          E2E_TEST_ORG_2: ${{ inputs.test_org_2 }}
        run: |
          go test -v -tags=e2e -timeout=${{ env.TEST_TIMEOUT }} ./test/e2e/...

  # ─────────────────────────────────────────────
  # Linux RPM: test inside a Fedora container
  # ─────────────────────────────────────────────
  e2e-linux-rpm:
    name: E2E / Fedora AMD64 RPM
    needs: download-assets
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install prerequisites
        run: dnf install -y git golang gh jq which

      - name: Download staged AMD64 RPM
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: release-linux-amd64-rpm
          path: ./e2e-artifact

      - name: Install RPM package
        run: rpm -i ./e2e-artifact/*.rpm

      - name: Verify standalone binary path and version
        run: |
          which gh-app-auth
          gh-app-auth --version
          gh-app-auth --help

      - name: Run E2E tests (against installed binary)
        env:
          E2E_BINARY_PATH: /usr/bin/gh-app-auth
          E2E_APP_ID: ${{ secrets.E2E_APP_ID }}
          E2E_PRIVATE_KEY_B64: ${{ secrets.E2E_PRIVATE_KEY_B64 }}
          E2E_TEST_ORG_1: ${{ inputs.test_org_1 }}
          E2E_TEST_ORG_2: ${{ inputs.test_org_2 }}
        run: |
          go test -v -tags=e2e -timeout=${{ env.TEST_TIMEOUT }} ./test/e2e/...

  # ─────────────────────────────────────────────
  # Linux DEB: test inside an Ubuntu container
  # ─────────────────────────────────────────────
  e2e-linux-deb:
    name: E2E / Ubuntu AMD64 DEB
    needs: download-assets
    runs-on: ubuntu-latest
    container:
      image: ubuntu:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y git golang-go gh jq curl

      - name: Download staged AMD64 DEB
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: release-linux-amd64-deb
          path: ./e2e-artifact

      - name: Install DEB package
        run: |
          dpkg -i ./e2e-artifact/*.deb || apt-get install -f -y

      - name: Verify standalone binary path and version
        run: |
          which gh-app-auth
          gh-app-auth --version
          gh-app-auth --help

      - name: Run E2E tests (against installed binary)
        env:
          E2E_BINARY_PATH: /usr/bin/gh-app-auth
          E2E_APP_ID: ${{ secrets.E2E_APP_ID }}
          E2E_PRIVATE_KEY_B64: ${{ secrets.E2E_PRIVATE_KEY_B64 }}
          E2E_TEST_ORG_1: ${{ inputs.test_org_1 }}
          E2E_TEST_ORG_2: ${{ inputs.test_org_2 }}
        run: |
          go test -v -tags=e2e -timeout=${{ env.TEST_TIMEOUT }} ./test/e2e/...

  # ─────────────────────────────────────────────
  # macOS ARM64: test the darwin-arm64 binary
  # ─────────────────────────────────────────────
  e2e-macos-arm64:
    name: E2E / macOS ARM64 Binary
    needs: download-assets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
