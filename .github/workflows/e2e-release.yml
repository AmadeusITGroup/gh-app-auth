          name: release-darwin-amd64-binary
          path: ./e2e-artifact

      - name: Prepare macOS AMD64 binary
        run: |
          mv ./e2e-artifact/darwin-amd64 ./e2e-artifact/gh-app-auth
          chmod +x ./e2e-artifact/gh-app-auth

      - name: Verify binary is standalone
