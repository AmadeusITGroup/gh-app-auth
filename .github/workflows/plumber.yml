name: Plumber

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  plumber:
    name: Workflow Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Plumber reads the workflow runs and one run log to prove the
      # token scope of each job.
      actions: read
      # Lists the findings under code scanning, next to CodeQL and gosec.
      security-events: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run Plumber
        uses: getplumber/plumber@v0.7.23
        with:
          # Pull requests from forks get no security-events write, so the
          # upload is skipped there. The report stays a workflow artifact.
          upload-sarif: ${{ github.event.pull_request.head.repo.fork != true }}
          # Fail under 85 points. The default gate is 100, where any
          # finding fails.
          min-points: 85
