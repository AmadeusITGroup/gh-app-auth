name: Release Please

# Maintains a release PR on main from conventional commits. Merging that PR
# makes release-please cut a tag + DRAFT release, then the `release` job below
# hands the tag to release.yml via workflow_call — the chain must be explicit
# because GITHUB_TOKEN-created tags never fire `push: tags`.
#
# `draft: true` in release-please-config.json is mandatory: a published release
# locks its assets under immutable releases, closing the staging window our
# pipeline needs.
on:
  push:
    branches: [main]
  workflow_dispatch: {}  # manual "maintain the release PR now"

permissions: {}  # deny-all by default; jobs declare their own

jobs:
  release-please:
    name: Maintain release PR / cut draft
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create tag + draft release, read history
      pull-requests: write  # maintain the release PR
    outputs:
      tag_name: ${{ steps.rp.outputs.tag_name || steps.rp.outputs['.--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: rp
        # config: release-please-config.json, manifest: .release-please-manifest.json

  # A release was cut → hand the tag to the real pipeline. `tag_name` is only
  # non-empty when release-please actually created a release this run.
  release:
    name: Release pipeline
    needs: release-please
    if: ${{ needs.release-please.outputs.tag_name != '' }}
    permissions:
      contents: write  # caller must grant what release.yml jobs request
      id-token: write  # transitive: attest job's OIDC token
      attestations: write  # transitive: attest job
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      E2E_APP_ID: ${{ secrets.E2E_APP_ID }}
      E2E_PRIVATE_KEY_B64: ${{ secrets.E2E_PRIVATE_KEY_B64 }}
