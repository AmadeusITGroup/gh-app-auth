name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '15 6 * * 1'

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    if: >-
      github.repository == 'AmadeusITGroup/gh-app-auth' &&
      !github.event.repository.fork &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
      security-events: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard and publish results
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: results.sarif
          category: openssf-scorecard
