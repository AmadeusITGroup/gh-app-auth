name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  golangci:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m

  actionlint:
    name: Action Lint
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail CI on workflow formatting
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check workflow files
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail CI on documentation formatting
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@v25.0.0
        with:
          globs: |
            **/*.md
            !node_modules/**
            !CHANGELOG.md

  yaml:
    name: YAML Lint
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail CI on YAML formatting
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Lint YAML files
        uses: karancode/yamllint-github-action@v3.0.0
        with:
          yamllint_file_or_dir: '.'
          yamllint_strict: false
          yamllint_comment: true
